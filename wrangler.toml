name = "visitpetrovac"
main = "./dist/server/entry.mjs"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[vars]
SITE_URL = "https://visitpetrovac.com"

# ─── D1 database (vraca se kad se kreira namespace) ──────────────
# 1. wrangler d1 create visitpetrovac-db
# 2. paste id ispod, otkomentarisi blok
# 3. wrangler d1 migrations apply visitpetrovac-db --remote
#
# [[d1_databases]]
# binding = "DB"
# database_name = "visitpetrovac-db"
# database_id = "REPLACE_WITH_D1_ID"
# migrations_dir = "migrations"

# ─── KV namespace za sesije (vraca se kad se kreira) ─────────────
# wrangler kv namespace create SESSION
#
# [[kv_namespaces]]
# binding = "SESSION"
# id = "REPLACE_WITH_KV_ID"

# Secrets (postavi preko Cloudflare dashboard-a):
# - GOOGLE_SHEETS_WEBHOOK_URL
# - IP_SALT
# - ANTHROPIC_API_KEY (za auto-translate u build koraku)
