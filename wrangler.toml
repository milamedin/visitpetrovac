name = "visitpetrovac"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://visitpetrovac.com"

# Astro adapter (@astrojs/cloudflare) automatski generise main i [assets]
# u dist/server/wrangler.json tokom build-a.
# Deploy command treba da bude:
#   npx wrangler deploy --config dist/server/wrangler.json

# ─── D1 database (vraca se kad se kreira namespace) ──────────────
# 1. wrangler d1 create visitpetrovac-db
# 2. paste id ispod, otkomentarisi blok
# 3. wrangler d1 migrations apply visitpetrovac-db --remote
#
# [[d1_databases]]
# binding = "DB"
# database_name = "visitpetrovac-db"
# database_id = "REPLACE_WITH_D1_ID"
# migrations_dir = "migrations"

# ─── KV namespace za sesije (vraca se kad se kreira) ─────────────
# wrangler kv namespace create SESSION
#
# [[kv_namespaces]]
# binding = "SESSION"
# id = "REPLACE_WITH_KV_ID"

# Secrets (postavljaju se preko Cloudflare dashboard-a):
# - ANTHROPIC_API_KEY (build-time, za auto-translate)
# - GOOGLE_SHEETS_WEBHOOK_URL (runtime, za tour booking)
# - IP_SALT (runtime, za hash-ovanje IP-a u logovima)
