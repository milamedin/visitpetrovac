<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · VisitPetrovac</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      /* Loading screen so the page doesn't flash white */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        background: #073b4c;
        color: #fff;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        flex-direction: column;
        gap: 1rem;
        z-index: 1;
      }
      .splash__logo {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .splash__logo em {
        font-style: italic;
        color: #5fdada;
      }
      .splash__text {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div>
        <div class="splash__logo">visit<em>petrovac</em></div>
        <div class="splash__text">Učitavanje admin panela…</div>
      </div>
    </div>

    <!-- Sveltia CMS — modern Material 3 UI, drop-in replacement for Decap CMS using same config.yml -->
    <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      // Hide splash once Sveltia takes over
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) s.style.display = 'none';
        }, 1500);
      });
    </script>
  </body>
</html>
