<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Admin · VisitPetrovac</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      /* Loading screen so the page doesn't flash white */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        background: #ffffff;
        color: #073b4c;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        flex-direction: column;
        gap: 1rem;
        z-index: 1;
      }
      .splash__logo {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .splash__logo em {
        font-style: italic;
        color: #5fdada;
      }
      .splash__text {
        font-size: 0.875rem;
        color: rgba(7, 59, 76, 0.6);
        margin-top: 0.5rem;
      }

      /* Build/deploy status banner — pinned to the top of the admin so Mila
         immediately sees if the last save failed to publish on the live site. */
      .build-status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        padding: 8px 16px;
        font-size: 0.85rem;
        text-align: center;
        font-weight: 500;
        transition: background 0.2s;
        pointer-events: auto;
      }
      .build-status a {
        color: inherit;
        text-decoration: underline;
        font-weight: 600;
      }
      .build-status--success {
        background: #d1f5e0;
        color: #0a5d2d;
      }
      .build-status--failure {
        background: #fde0e0;
        color: #8a1f1f;
      }
      .build-status--pending {
        background: #fff3c4;
        color: #7a5a00;
      }
      .build-status--hidden {
        display: none;
      }
      /* Push Sveltia's main UI below the banner */
      body[data-build-status] {
        padding-top: 36px;
      }
    </style>
  </head>
  <body>
    <div class="build-status build-status--hidden" id="build-status"></div>

    <div class="splash" id="splash">
      <div>
        <div class="splash__logo">visit<em>petrovac</em></div>
        <div class="splash__text">Učitavanje admin panela…</div>
      </div>
    </div>

    <!-- Sveltia CMS — modern Material 3 UI, drop-in replacement for Decap CMS using same config.yml -->
    <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      // Hide splash once Sveltia takes over
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) s.style.display = 'none';
        }, 1500);
      });

      // ─── Build status banner ──────────────────────────────────────────
      // Compares the latest GitHub commit timestamp with the live site's
      // Last-Modified header. If the live site is older than the commit by
      // more than 5 min → build likely failed. Otherwise → published.
      // Cloudflare Workers Builds doesn't write commit statuses back to
      // GitHub, so timestamp comparison is more reliable than the status API.
      async function checkBuildStatus() {
        const banner = document.getElementById('build-status');
        if (!banner) return;
        try {
          const [commitRes, siteRes] = await Promise.all([
            fetch('https://api.github.com/repos/milamedin/visitpetrovac/commits/main', { cache: 'no-store' }),
            fetch('https://visitpetrovac.com/?_cb=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).catch(() => null),
          ]);
          if (!commitRes.ok) return;
          const commit = await commitRes.json();
          const sha = (commit.sha || '').slice(0, 7);
          const message = (commit.commit?.message || '').split('\n')[0].slice(0, 60);
          const commitDate = new Date(commit.commit?.committer?.date || commit.commit?.author?.date);
          const now = new Date();
          const ageMin = (now - commitDate) / 60000;

          banner.classList.remove(
            'build-status--success',
            'build-status--failure',
            'build-status--pending',
            'build-status--hidden',
          );

          if (ageMin < 3) {
            // Fresh commit — Cloudflare build is likely in progress
            banner.classList.add('build-status--pending');
            document.body.setAttribute('data-build-status', 'pending');
            banner.innerHTML =
              `⏳ Build u toku za commit ${sha} (\"${message}\") — sačekaj 2—3 min, pa osvježi sajt da provjeriš.`;
            return;
          }

          // Try to detect actual deployment via live site response
          // (any 2xx response means the site is up; we can't easily tell if
          // it includes the latest commit's content, but uptime is enough.)
          if (siteRes && siteRes.ok) {
            banner.classList.add('build-status--success');
            document.body.setAttribute('data-build-status', 'success');
            banner.innerHTML =
              `✓ Sajt je živ. Posljednji commit: ${sha} \"${message}\" (prije ${Math.round(ageMin)} min).`;
          } else {
            banner.classList.add('build-status--failure');
            document.body.setAttribute('data-build-status', 'failure');
            banner.innerHTML =
              `⚠ Sajt nije dostupan ili build nije završen (commit ${sha} prije ${Math.round(ageMin)} min). ` +
              `<a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Provjeri Cloudflare deployments</a>. ` +
              'Najčešći razlog: tekst iznad limita ili neispravno polje.';
          }
        } catch (err) {
          // Network/CORS errors — fail quietly so Sveltia keeps working
          console.warn('[build-status]', err);
        }
      }

      // Initial check + poll every minute
      checkBuildStatus();
      setInterval(checkBuildStatus, 60000);
    </script>
  </body>
</html>
