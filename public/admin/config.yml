      - name: "owner"
        label: "Vlasnik / organizator (kontakt se povlači odavde)"
        widget: "relation"
        collection: "owners"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "excerpt", label: "Kratak opis (max 200 znakova)", widget: "text", pattern: ['^[\s\S]{1,200}$', 'Predug — maksimalno 200 znakova. Skrati prije nego što sačuvaš.'] }
      - name: "activity_type"
        label: "Tip iskustva"
        widget: "select"
        required: false
        options:
          - { label: "Izlet brodom", value: "brod" }
          - { label: "Kajak / SUP", value: "kajak-sup" }
          - { label: "Ronjenje", value: "ronjenje" }
          - { label: "Hiking", value: "hiking" }
          - { label: "Ribolov", value: "ribolov" }
          - { label: "Kultura / istorija", value: "kultura" }
          - { label: "Gastro / kuvanje", value: "gastro" }
          - { label: "Fotoshooting", value: "foto" }
      - { name: "price_from", label: "Cijena od (€)", widget: "number", required: false, value_type: "int", min: 0 }
      - name: "price_unit"
        label: "Jedinica cijene"
        widget: "select"
        default: "per_person"
        options:
          - { label: "Po osobi", value: "per_person" }
          - { label: "Po danu", value: "per_day" }
          - { label: "Fiksno", value: "fixed" }
      - { name: "capacity", label: "Maksimalan broj učesnika", widget: "number", required: false, value_type: "int" }
      - name: "neighborhood"
        label: "Polazna tačka (naselje)"
        widget: "relation"
        collection: "neighborhoods"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "amenities", label: "Šta je uključeno (Vodič, Oprema, Transport, Ručak...)", widget: "list", required: false, default: [], summary: "{{fields.amenity}}" }
      - name: "images"
        label: "Fotografije"
        widget: "list"
        media_folder: "/public/uploads/listings"
        public_folder: "/uploads/listings"
        field: { name: "src", label: "Fotografija", widget: "image" }
      - { name: "rating", label: "Ocjena (0—5)", widget: "number", required: false, min: 0, max: 5, step: 0.1, value_type: "float" }
      - { name: "youtube_url", label: "YouTube link (opciono)", widget: "string", required: false, pattern: ['^$|^https?://(www\\.)?(youtube\\.com|youtu\\.be)/.+', 'Ostavi prazno ili unesi YouTube URL'] }
      - { name: "website", label: "Sajt organizatora (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
      - { name: "premium", label: "Premium pozicija (pojavljuje se prvi)", widget: "boolean", default: false }
      - { name: "created_at", label: "Datum kreiranja", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "published", label: "Objavljen", widget: "boolean", default: true }
      - { name: "body", label: "Detaljan opis (markdown)", widget: "markdown", required: false }

  - name: "rentacar"
    label: "Rent-a-car"
    label_singular: "Rent-a-car agencija"
    folder: "src/content/rentacar"
