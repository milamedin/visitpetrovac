# Sveltia CMS config — edit content from the browser, commits go to Git.
# Login via "Sign In Using Access Token" with a fine-grained GitHub PAT.

backend:
  name: github
  repo: milamedin/visitpetrovac
  branch: main
  open_authoring: false

local_backend: true
media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://visitpetrovac.com
display_url: https://visitpetrovac.com
logo_url: /favicon.svg
locale: 'en'
publish_mode: simple

collections:
  # ────────── LISTINZI ──────────
  - divider: true
    label: "📌 Listinzi"

  - name: "smjestaj"
    label: "Smještaj"
    label_singular: "Smještaj"
    folder: "src/content/smjestaj"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ['title', 'price_from', 'rating', 'created_at']
    view_filters:
      - { label: "Premium", field: "premium", pattern: true }
    fields:
      - { name: "title", label: "Naslov", widget: "string" }
      - name: "owner"
        label: "Vlasnik (kontakt se povlači odavde)"
        widget: "relation"
        collection: "owners"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "excerpt", label: "Kratak opis (max 200 znakova)", widget: "text", pattern: ['^[\s\S]{1,200}$', 'Predug — maksimalno 200 znakova. Skrati prije nego što sačuvaš.'] }
      - name: "accommodation_type"
        label: "Tip smještaja"
        widget: "select"
        required: false
        options:
          - { label: "Hotel", value: "hotel" }
          - { label: "Vila", value: "vila" }
          - { label: "Kuća", value: "kuca" }
          - { label: "Apartman", value: "apartman" }
          - { label: "Soba", value: "soba" }
      - { name: "price_from", label: "Cijena od (€)", widget: "number", required: false, value_type: "int", min: 0 }
      - name: "price_unit"
        label: "Jedinica cijene"
        widget: "select"
        default: "per_night"
        options:
          - { label: "Po noći", value: "per_night" }
          - { label: "Po osobi", value: "per_person" }
          - { label: "Fiksno", value: "fixed" }
      - { name: "capacity", label: "Kapacitet (osoba)", widget: "number", required: false, value_type: "int" }
      - name: "neighborhood"
        label: "Naselje"
        widget: "relation"
        collection: "neighborhoods"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "amenities", label: "Pogodnosti (WiFi, Klima, Parking, Bazen...)", widget: "list", required: false, default: [], summary: "{{fields.amenity}}" }
      - name: "images"
        label: "Fotografije"
        widget: "list"
        media_folder: "/public/uploads/listings"
        public_folder: "/uploads/listings"
        field: { name: "src", label: "Fotografija", widget: "image" }
      - name: "units"
        label: "Smještajne jedinice (samo za kuće sa više apartmana / hotele — ostavi prazno za samostalni objekat)"
        widget: "list"
        required: false
        summary: "{{fields.name}} — {{fields.capacity}} osoba — od {{fields.price_from}}€"
        fields:
          - { name: "name", label: "Naziv jedinice", widget: "string" }
          - { name: "capacity", label: "Kapacitet (osoba)", widget: "number", value_type: "int", min: 1 }
          - { name: "price_from", label: "Cijena od (€)", widget: "number", required: false, value_type: "int", min: 0 }
          - { name: "description", label: "Kratki opis", widget: "text", required: false }
          - { name: "image", label: "Fotografija jedinice", widget: "image", required: false, media_folder: "/public/uploads/listings", public_folder: "/uploads/listings" }
      - name: "location"
        label: "Lokacija"
        widget: "object"
        required: false
        fields:
          - { name: "address", label: "Adresa", widget: "string", required: false }
          - { name: "lat", label: "Geografska širina (lat)", widget: "number", required: false, value_type: "float" }
          - { name: "lng", label: "Geografska dužina (lng)", widget: "number", required: false, value_type: "float" }
      - { name: "rating", label: "Ocjena (0—5)", widget: "number", required: false, min: 0, max: 5, step: 0.1, value_type: "float" }
      - { name: "booking_url", label: "Booking.com link (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
      - { name: "youtube_url", label: "YouTube link (opciono)", widget: "string", required: false, pattern: ['^$|^https?://(www\\.)?(youtube\\.com|youtu\\.be)/.+', 'Ostavi prazno ili unesi YouTube URL'] }
      - { name: "website", label: "Sajt objekta (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
      - { name: "premium", label: "Premium pozicija (pojavljuje se prvi)", widget: "boolean", default: false }
      - { name: "created_at", label: "Datum kreiranja", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "published", label: "Objavljen", widget: "boolean", default: true }
      - { name: "body", label: "Detaljan opis (markdown)", widget: "markdown", required: false }

  - name: "restorani"
    label: "Restorani i kafići"
    label_singular: "Restoran / kafić"
    folder: "src/content/restorani"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ['title', 'price_from', 'rating', 'created_at']
    view_filters:
      - { label: "Premium", field: "premium", pattern: true }
    fields:
      - { name: "title", label: "Naslov", widget: "string" }
      - name: "owner"
        label: "Vlasnik (kontakt se povlači odavde)"
        widget: "relation"
        collection: "owners"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "excerpt", label: "Kratak opis (max 200 znakova)", widget: "text", pattern: ['^[\s\S]{1,200}$', 'Predug — maksimalno 200 znakova. Skrati prije nego što sačuvaš.'] }
      - name: "restaurant_type"
        label: "Tip restorana"
        widget: "select"
        required: false
        options:
          - { label: "Restoran", value: "restoran" }
          - { label: "Konoba", value: "konoba" }
          - { label: "Pizzeria", value: "pizzeria" }
          - { label: "Slastičarna", value: "slasticarna" }
          - { label: "Bar / Kafić", value: "bar" }
          - { label: "Beach bar", value: "beach-bar" }
      - { name: "price_from", label: "Prosječna cijena obroka (€)", widget: "number", required: false, value_type: "int", min: 0 }
      - name: "price_unit"
        label: "Jedinica cijene"
        widget: "select"
        default: "per_meal"
        options:
          - { label: "Po obroku", value: "per_meal" }
          - { label: "Po osobi", value: "per_person" }
          - { label: "Fiksno", value: "fixed" }
      - { name: "capacity", label: "Kapacitet (osoba)", widget: "number", required: false, value_type: "int" }
      - name: "neighborhood"
        label: "Naselje"
        widget: "relation"
        collection: "neighborhoods"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "amenities", label: "Pogodnosti (Terasa, Pogled na more, Live muzika, Domaće vino...)", widget: "list", required: false, default: [], summary: "{{fields.amenity}}" }
      - name: "images"
        label: "Fotografije"
        widget: "list"
        media_folder: "/public/uploads/listings"
        public_folder: "/uploads/listings"
        field: { name: "src", label: "Fotografija", widget: "image" }
      - name: "menu_url"
        label: "Meni / jelovnik (PDF ili slika)"
        widget: "file"
        required: false
        media_folder: "/public/uploads/menus"
        public_folder: "/uploads/menus"
      - name: "location"
        label: "Lokacija"
        widget: "object"
        required: false
        fields:
          - { name: "address", label: "Adresa", widget: "string", required: false }
          - { name: "lat", label: "Geografska širina (lat)", widget: "number", required: false, value_type: "float" }
          - { name: "lng", label: "Geografska dužina (lng)", widget: "number", required: false, value_type: "float" }
      - { name: "rating", label: "Ocjena (0—5)", widget: "number", required: false, min: 0, max: 5, step: 0.1, value_type: "float" }
      - { name: "booking_url", label: "Booking.com link (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
      - { name: "youtube_url", label: "YouTube link (opciono)", widget: "string", required: false, pattern: ['^$|^https?://(www\\.)?(youtube\\.com|youtu\\.be)/.+', 'Ostavi prazno ili unesi YouTube URL'] }
      - { name: "website", label: "Sajt objekta (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
      - { name: "premium", label: "Premium pozicija (pojavljuje se prvi)", widget: "boolean", default: false }
      - { name: "created_at", label: "Datum kreiranja", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "published", label: "Objavljen", widget: "boolean", default: true }
      - { name: "body", label: "Detaljan opis (markdown)", widget: "markdown", required: false }

  - name: "iskustva"
    label: "Iskustva"
    label_singular: "Iskustvo"
    folder: "src/content/iskustva"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ['title', 'price_from', 'rating', 'created_at']
    view_filters:
      - { label: "Premium", field: "premium", pattern: true }
