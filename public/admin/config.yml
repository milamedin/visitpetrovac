      - name: "neighborhood"
        label: "Mjesto preuzimanja (naselje)"
        widget: "relation"
        collection: "neighborhoods"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
      - { name: "amenities", label: "Usluge (Dostava do aerodroma, Auto-sjedište, Kasko osiguranje, GPS...)", widget: "list", required: false, default: [], summary: "{{fields.amenity}}" }
      - name: "images"
        label: "Fotografije vozila / agencije"
        widget: "list"
        media_folder: "/public/uploads/listings"
        public_folder: "/uploads/listings"
        field: { name: "src", label: "Fotografija", widget: "image" }
      - name: "location"
        label: "Lokacija preuzimanja"
        widget: "object"
        required: false
        fields:
          - { name: "address", label: "Adresa", widget: "string", required: false }
          - { name: "lat", label: "Geografska širina (lat)", widget: "number", required: false, value_type: "float" }
          - { name: "lng", label: "Geografska dužina (lng)", widget: "number", required: false, value_type: "float" }
      - { name: "rating", label: "Ocjena (0—5)", widget: "number", required: false, min: 0, max: 5, step: 0.1, value_type: "float" }
      - { name: "website", label: "Sajt agencije (opciono)", widget: "string", required: false, pattern: ['^$|^https?://.+', 'Ostavi prazno ili unesi URL'] }
